modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''${mod_description}'''

[[mixins]]
config = "nh_bounties.mixins.json"

[[dependencies.${mod_id}]]
    modId = "neoforge"
    type = "required"
    versionRange = "${neo_version_range}"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.${mod_id}]]
    modId = "minecraft"
    type = "required"
    versionRange = "${minecraft_version_range}"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.${mod_id}]]
    modId = "cobblemon"
    type = "required"
    versionRange = "[1.8.4,)"
    ordering = "AFTER"
    side = "BOTH"

# Objective types are looked up by id on the client too, to draw bounty tooltips, so this mod
# must be installed on both sides.
[[dependencies.${mod_id}]]
    modId = "bountiful"
    type = "required"
    versionRange = "[8.0.0-beta.2,)"
    ordering = "AFTER"
    side = "BOTH"

[[dependencies.${mod_id}]]
    modId = "nh_worldbuild"
    type = "required"
    versionRange = "[0.2.0,)"
    ordering = "AFTER"
    side = "BOTH"
