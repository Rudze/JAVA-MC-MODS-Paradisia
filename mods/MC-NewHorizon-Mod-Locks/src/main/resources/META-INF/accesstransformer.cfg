# Locks Mod Access Transformers for 1.21.1 (NeoForge)
# NeoForge remaps to official Mojang names since 1.20.2 - ATs use official names, not SRG.
# Every target below was verified against the real 1.21.1 decompiled source before porting.

# Frustum - cubeInFrustum for lock render culling (private -> public)
public net.minecraft.client.renderer.culling.Frustum cubeInFrustum(DDDDDD)Z

# LevelRenderer - capturedFrustum for debug rendering (private -> public)
public net.minecraft.client.renderer.LevelRenderer capturedFrustum

# GameRenderer - getFov for perspective calculations (private -> public)
public net.minecraft.client.renderer.GameRenderer getFov(Lnet/minecraft/client/Camera;FZ)D

# VillagerTrades inner classes - for adding custom trades (package-private -> public)
public net.minecraft.world.entity.npc.VillagerTrades$ItemsForEmeralds
public net.minecraft.world.entity.npc.VillagerTrades$EnchantedItemForEmeralds

# PistonStructureResolver - level and startPos (private -> public)
public net.minecraft.world.level.block.piston.PistonStructureResolver level
public net.minecraft.world.level.block.piston.PistonStructureResolver startPos

# Explosion - level field for explosion context mixin (private -> public)
public net.minecraft.world.level.Explosion level

# RandomizableContainerBlockEntity - lootTable, for skipping empty chests during worldgen
# (protected -> public; Locks reads this from unrelated-package helper code, not just mixins/subclasses)
public net.minecraft.world.level.block.entity.RandomizableContainerBlockEntity lootTable
