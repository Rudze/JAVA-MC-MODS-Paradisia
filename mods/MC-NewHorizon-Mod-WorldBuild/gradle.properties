# Sets default memory used for gradle commands.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
org.gradle.debug=false

# Minecraft / NeoForge versions
minecraft_version=1.21.1
minecraft_version_range=[1.21.1,1.22)
neo_version=21.1.235
neo_version_range=[21.1.0,)
loader_version_range=[4,)

# Mod properties
mod_id=nh_worldbuild
mod_name=NewHorizon: World Build
mod_license=All Rights Reserved
mod_version=0.2.0
mod_group_id=com.rudze.worldbuild
mod_authors=Rudze
mod_description=Adds the world_build dimension (loaded from an external premade map) and links it to the main world via a Waystone A / Waystone B pair spawned at each world's spawn point. Also handles world_build claims (golden shovel + /claim) and their weekly land tax.

# Sibling mod this depends on (must already be built: ../MC-NewHorizon-Mod-WaystoneTP/build/libs)
waystonetp_mod_id=nh_waystonetp
